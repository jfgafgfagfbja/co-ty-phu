<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cờ Tỷ Phú</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
  <header class="topbar">
    <h1>🎲 Cờ Tỷ Phú</h1>
    <nav class="top-actions">
      <button type="button" class="btn ghost room" id="btn-room" hidden></button>
      <button type="button" class="btn ghost" id="btn-rules" title="Luật chơi">📖 <span class="lbl">Luật chơi</span></button>
      <button type="button" class="btn ghost" id="btn-end" title="Kết thúc ván">🏁 <span class="lbl">Kết thúc ván</span></button>
      <button type="button" class="btn ghost" id="btn-new" title="Ván mới">✨ <span class="lbl">Ván mới</span></button>
    </nav>
  </header>

  <main class="layout">
    <section class="stage" id="stage">
      <div class="board" id="board" aria-label="Bàn cờ">
        <div class="center">
          <div class="brand">
            <div class="logo">CỜ TỶ PHÚ</div>
            <div class="sub">Hành trình khắp Việt Nam</div>
          </div>
          <div class="dice" aria-label="Xúc xắc">
            <div class="die-wrap"><div class="die" id="die1"></div></div>
            <div class="die-wrap"><div class="die" id="die2"></div></div>
          </div>
          <div class="center-info" id="center-info"></div>
        </div>
        <div class="pieces" id="pieces"></div>
      </div>
      <button type="button" class="view-toggle" id="btn-view" title="Đổi góc nhìn bàn cờ"></button>
    </section>

    <aside class="side">
      <div id="panel" class="panel" aria-live="polite"></div>
      <div class="box">
        <h3>Người chơi</h3>
        <div id="players" class="players"></div>
      </div>
      <div class="box">
        <h3>Nhật ký</h3>
        <ol id="log" class="log"></ol>
      </div>
    </aside>
  </main>

  <div id="modals"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/data.js?v=8"></script>
  <script src="js/game.js?v=8"></script>
  <script src="js/firebase-config.js?v=8"></script>
  <script src="js/net.js?v=8"></script>
  <script src="js/models.js?v=8"></script>
  <script src="js/ui.js?v=8"></script>
</body>
</html>
